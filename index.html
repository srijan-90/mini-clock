<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MINI CLOCK · MINI LAB</title>
<meta name="description" content="A calm, customizable clock by MINI LAB."><meta name="theme-color" content="#050505">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#050505;--fg:#f4f4f5;--mut:#85878d;--line:#292a2e;--acc:#ff6a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;min-height:100svh;display:flex;flex-direction:column;transition:.25s}body.light{color-scheme:light;--bg:#f1f3f5;--fg:#17181b;--mut:#666b74;--line:#d8dce1}header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px}.brand{font-weight:650;letter-spacing:.04em}.brand span{color:var(--mut);font-weight:400;margin-left:8px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 13px}button{cursor:pointer}button:hover{border-color:var(--acc)}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;min-height:60vh}#clock{font-size:clamp(4rem,22vw,17rem);font-weight:300;letter-spacing:-.075em;font-variant-numeric:tabular-nums;line-height:1}#clock.analog{font-size:clamp(15rem,65vw,30rem);letter-spacing:0}#date,#zone{color:var(--mut);font-size:clamp(14px,2vw,19px)}#zone b{color:var(--fg);margin-left:10px;font-weight:500}.colon{color:var(--acc)}.panel{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.panel[hidden]{display:none}footer{text-align:center;color:var(--mut);font-size:12px;padding:16px}select{max-width:180px}@media(max-width:600px){header{padding:14px;align-items:flex-start;gap:12px;flex-direction:column}#clock{font-size:clamp(4rem,20vw,8rem)}}
</style></head>
<body><header><div class="brand">MINI CLOCK <span>MINI LAB</span></div><nav><button id="install" hidden>Install</button><button id="settings">Settings</button><button id="full">Full screen</button></nav></header>
<main><div id="clock" aria-live="off">00:00</div><div id="date"></div><div id="zone"></div><section class="panel" id="panel" hidden><button data-style="digital">Digital</button><button data-style="analog">Analog</button><button data-style="words">Words</button><button id="format">12 / 24 hour</button><button id="theme">Light / Dark</button><select id="timezone"><option value="">Second time zone off</option><option value="Asia/Kolkata">India</option><option value="Asia/Tokyo">Tokyo</option><option value="Europe/London">London</option><option value="America/New_York">New York</option><option value="Asia/Dubai">Dubai</option><option value="Australia/Sydney">Sydney</option></select><label><input id="seconds" type="checkbox" checked> Seconds</label><label><input id="showdate" type="checkbox" checked> Date</label></section></main><footer>Designed with care by MINI LAB · A little time, thoughtfully displayed.</footer>
<script>
(()=>{const $=id=>document.getElementById(id);let style='digital',h24=false,light=false,zone='',showSeconds=true,showDate=true;const words=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];function draw(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),hour=h%12||12;let text='';if(style==='digital'){text=(h24?String(h).padStart(2,'0'):hour)+':'+String(m).padStart(2,'0')+(showSeconds?':'+String(s).padStart(2,'0'):'')+(h24?'':(h<12?' AM':' PM'));$('clock').innerHTML=text.replace(':','<span class="colon">:</span>').replace(':','<span class="colon">:</span>')}else if(style==='words'){const n=Math.round(m/5)%12,hr=(hour+(n>6?1:0))%12;const phrases=['','five past','ten past','quarter past','twenty past','twenty-five past','half past','twenty-five to','twenty to','quarter to','ten to','five to'];$('clock').textContent=(phrases[n]?phrases[n]+' ':'')+words[hr]}else{$('clock').textContent='◷';$('clock').classList.add('analog');$('clock').style.fontFamily='system-ui'}if(style!=='analog')$('clock').classList.remove('analog');$('date').hidden=!showDate;$('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('zone').textContent='';if(zone){const label=$('timezone').selectedOptions[0].text;const t=d.toLocaleTimeString([],{timeZone:zone,hour:'2-digit',minute:'2-digit'});$('zone').innerHTML=label+' <b>'+t+'</b>'}}setInterval(draw,250);draw();$('settings').onclick=()=>$('panel').hidden=!$('panel').hidden;$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;draw()});$('format').onclick=()=>{h24=!h24;draw()};$('theme').onclick=()=>{light=!light;document.body.classList.toggle('light',light)};$('timezone').onchange=e=>{zone=e.target.value;draw()};$('seconds').onchange=e=>{showSeconds=e.target.checked;draw()};$('showdate').onchange=e=>{showDate=e.target.checked;draw()};let promptEvent;$('install').onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;$('install').hidden=true}};addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').hidden=false});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')$('full').click();if(e.key.toLowerCase()==='s')$('settings').click();if(e.key===' ') {e.preventDefault();style=style==='digital'?'analog':style==='analog'?'words':'digital';draw()}})})();
</script></body></html>

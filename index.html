<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MINI CLOCK · MINI LAB</title><meta name="description" content="A thoughtful, customizable clock by MINI LAB."><meta name="theme-color" content="#050505">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--fg:#f4f4f5;--mut:#858a93;--panel:#111317;--line:#292d34;--accent:#ff6a00;--font:'Space Grotesk',system-ui,sans-serif;--weight:300}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100svh;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;transition:background .25s,color .25s}
body[data-font="mono"]{--font:'JetBrains Mono',monospace;--weight:400}body[data-font="serif"]{--font:'DM Serif Display',Georgia,serif;--weight:400}body[data-font="cond"]{--font:'Oswald',sans-serif;--weight:400}
body[data-theme="light"]{--bg:#f1f3f5;--fg:#17191d;--mut:#6e747e;--panel:#fff;--line:#d9dde3;color-scheme:light}
header{height:64px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);transition:height .2s,padding .2s,border-color .2s}
.brand{font-weight:600;letter-spacing:.08em;font-size:13px}.brand span{color:var(--mut);font-weight:400;margin-left:9px}
.actions{display:flex;align-items:center;gap:10px}a,button{color:inherit;font:inherit;text-decoration:none}button,.action{border:1px solid var(--line);background:transparent;padding:10px 15px;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s}button:hover,.action:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
main{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
#clock{font-family:var(--font);font-weight:var(--weight);font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1;font-size:clamp(68px,16vw,210px);white-space:nowrap}
#clock .colon{color:var(--accent)}#clock .ampm{font:500 .15em system-ui,sans-serif;letter-spacing:.04em;color:var(--mut);margin-left:.65em}
#clock.words{white-space:normal;font-size:clamp(48px,9vw,112px);letter-spacing:-.035em}
#clock svg{display:block;width:min(64vw,390px);height:auto}
#date{color:var(--mut);font-size:14px;letter-spacing:.04em}#zone{font-size:13px;color:var(--mut);min-height:20px}#zone strong{color:var(--fg);font-weight:500;margin-left:10px}
.hint{margin-top:28px;color:var(--mut);font-size:11px;letter-spacing:.08em}
@media(max-width:600px){header{height:58px;padding:0 16px}.brand span{display:none}.actions{gap:7px}.actions button{padding:8px 10px;font-size:13px}main{padding:16px 14px}}

/* Keep the clock face clean until the first interaction. */
body:not(.ui-revealed) header{height:0;padding-top:0;padding-bottom:0;border-color:transparent;overflow:hidden}
body:not(.ui-revealed) header>*,body:not(.ui-revealed) #date{opacity:0;visibility:hidden;pointer-events:none}
body.ui-revealed header>*,body.ui-revealed #date{opacity:1;visibility:visible;transition:opacity .25s ease}
</style></head>
<body data-theme="dark" data-font="sans">
<header><div class="brand">MINI CLOCK <span>BY MINI LAB</span></div><div class="actions"><button id="install" hidden>Install</button><a class="action" href="./settings.html">Settings ↗</a><button id="full">Fullscreen</button></div></header>
<main><div id="clock" aria-live="off">00:00</div><div id="date"></div><div id="zone"></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);const defaults={theme:'dark',style:'digital',font:'sans',h24:false,sec:true,date:true,zone:'',accent:'#ff6a00'};let S={...defaults};try{S={...S,...JSON.parse(localStorage.getItem('miniclock')||'{}')}}catch(e){}
const theme=()=>S.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme;
function apply(){document.body.dataset.theme=theme();document.body.dataset.font=S.font||'sans';document.documentElement.style.setProperty('--accent',S.accent||defaults.accent);document.querySelector('meta[name=theme-color]').content=theme()==='dark'?'#08090b':'#f1f3f5'}
function analog(d){const h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds();let ticks='';for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5===0?84:89,r2=94;ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="${i%5===0?'var(--fg)':'var(--mut)'}" stroke-width="${i%5===0?1.8:.7}"/>`}for(let n=1;n<=12;n++){const a=n*Math.PI/6;ticks+=`<text x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)}" fill="var(--fg)" font-size="10" text-anchor="middle" dominant-baseline="central">${n}</text>`}return `<svg viewBox="0 0 200 200" role="img" aria-label="Analog clock"><circle cx="100" cy="100" r="97" fill="none" stroke="var(--line)" stroke-width="1.5"/>${ticks}<g transform="translate(100 100) rotate(${(h+m/60)*30})"><path d="M0 8V-48" stroke="var(--fg)" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(100 100) rotate(${(m+s/60)*6})"><path d="M0 12V-70" stroke="var(--fg)" stroke-width="2.6" stroke-linecap="round"/></g><g transform="translate(100 100) rotate(${s*6})"><path d="M0 18V-82" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/></g><circle cx="100" cy="100" r="3" fill="var(--accent)"/></svg>`}
const words=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'],phrases=['','five past','ten past','quarter past','twenty past','twenty-five past','half past','twenty-five to','twenty to','quarter to','ten to','five to'];
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),hour=h%12||12;const c=$('clock');if(S.style==='analog'){c.className='';c.innerHTML=analog(d)}else if(S.style==='words'){const n=Math.round(m/5)%12,hr=(hour+(n>6?1:0))%12;c.className='words';c.textContent=(phrases[n]?phrases[n]+' ':'')+words[hr]}else{c.className='';const hh=S.h24?String(h).padStart(2,'0'):String(hour);c.innerHTML=hh+'<span class="colon">:</span>'+String(m).padStart(2,'0')+(S.sec?'<span class="colon">:</span>'+String(s).padStart(2,'0'):'')+(S.h24?'':'<span class="ampm">'+(h<12?'AM':'PM')+'</span>')}
$('date').hidden=!S.date;$('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('zone').textContent='';if(S.zone){const label=({ 'Asia/Kolkata':'India','Asia/Tokyo':'Tokyo','Europe/London':'London','America/New_York':'New York','Asia/Dubai':'Dubai','Australia/Sydney':'Sydney','Europe/Paris':'Paris','Asia/Singapore':'Singapore','America/Los_Angeles':'Los Angeles'})[S.zone]||S.zone;const t=d.toLocaleTimeString([],{timeZone:S.zone,hour:'2-digit',minute:'2-digit',hour12:!S.h24});$('zone').innerHTML=label+' <strong>'+t+'</strong>'}}
apply();tick();setInterval(tick,250);
let uiHideTimer;
const revealUI=()=>{
  document.body.classList.add('ui-revealed');
  clearTimeout(uiHideTimer);
  uiHideTimer=setTimeout(()=>document.body.classList.remove('ui-revealed'),5000);
};
addEventListener('pointermove',revealUI,{passive:true});
addEventListener('pointerdown',revealUI);
addEventListener('keydown',revealUI);
addEventListener('touchstart',revealUI,{passive:true});
addEventListener('storage',e=>{if(e.key==='miniclock'){try{S={...defaults,...JSON.parse(e.newValue||'{}')};apply();tick()}catch(err){}}});
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON|A/.test(e.target.tagName)){e.preventDefault();S.style=({digital:'analog',analog:'words',words:'digital'})[S.style]||'digital';tick()}if(e.key.toLowerCase()==='f')$('full').click()});
let installPrompt;$('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').hidden=true}};addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').hidden=false});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
